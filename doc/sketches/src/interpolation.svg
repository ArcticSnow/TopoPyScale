<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5f99"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#fff"/>
  <!-- (a) horizontal -->
  <text x="20" y="28" font-weight="bold">(a) Horizontal: the 3 × 3 ERA5 nodes</text>
  <g stroke="#bbb" stroke-dasharray="3 3">
    <line x1="60" y1="60" x2="60" y2="300"/><line x1="150" y1="60" x2="150" y2="300"/><line x1="240" y1="60" x2="240" y2="300"/>
    <line x1="30" y1="90" x2="270" y2="90"/><line x1="30" y1="180" x2="270" y2="180"/><line x1="30" y1="270" x2="270" y2="270"/>
  </g>
  <g stroke="#c0392b" stroke-width="1" opacity="0.6">
    <line x1="172" y1="158" x2="60" y2="90"/><line x1="172" y1="158" x2="150" y2="90"/><line x1="172" y1="158" x2="240" y2="90"/>
    <line x1="172" y1="158" x2="60" y2="180"/><line x1="172" y1="158" x2="150" y2="180"/><line x1="172" y1="158" x2="240" y2="180"/>
    <line x1="172" y1="158" x2="60" y2="270"/><line x1="172" y1="158" x2="150" y2="270"/><line x1="172" y1="158" x2="240" y2="270"/>
  </g>
  <g fill="#4a7fb0">
    <circle cx="60" cy="90" r="6"/><circle cx="150" cy="90" r="6"/><circle cx="240" cy="90" r="6"/>
    <circle cx="60" cy="180" r="6"/><circle cx="150" cy="180" r="6"/><circle cx="240" cy="180" r="6"/>
    <circle cx="60" cy="270" r="6"/><circle cx="150" cy="270" r="6"/><circle cx="240" cy="270" r="6"/>
  </g>
  <circle cx="150" cy="180" r="11" fill="none" stroke="#4a7fb0" stroke-width="1.5"/>
  <text x="112" y="207" fill="#4a7fb0">nearest</text>
  <circle cx="172" cy="158" r="6" fill="#c0392b"/>
  <text x="182" y="150" fill="#c0392b" font-weight="bold">P</text>
  <text x="196" y="132" fill="#c0392b">d</text><text x="203" y="136" fill="#c0392b" font-size="10">i</text>
  <text x="20" y="330">idw (default):  w<tspan baseline-shift="sub" font-size="10">i</tspan> = d<tspan baseline-shift="sub" font-size="10">i</tspan><tspan baseline-shift="super" font-size="10">−2</tspan> / Σ<tspan baseline-shift="sub" font-size="10">j</tspan> d<tspan baseline-shift="sub" font-size="10">j</tspan><tspan baseline-shift="super" font-size="10">−2</tspan></text>
  <text x="20" y="352">linear: bilinear in latitude, longitude</text>
  <text x="20" y="374" fill="#555">applied to every field and every level</text>

  <!-- (b) vertical -->
  <text x="330" y="28" font-weight="bold">(b) Vertical: from the pressure levels to the elevation of the point</text>
  <path d="M360,345 L420,330 L470,270 L520,190 L560,150 L600,200 L640,280 L680,320 L720,318 L770,280 L820,240 L880,225 L880,390 L360,390 Z" fill="#efe7dc" stroke="#8c7b6b" stroke-width="2"/>
  <path d="M360,300 C470,288 560,280 640,288 C720,296 800,292 880,284" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="712" y="345" fill="#666" font-size="12">ERA5 surface z<tspan baseline-shift="sub" font-size="10">s</tspan> (smooth)</text>
  <line x1="745" y1="333" x2="745" y2="296" stroke="#888" stroke-width="1"/>
  <g stroke="#4a7fb0" stroke-dasharray="5 4" stroke-width="1.2">
    <line x1="360" y1="70" x2="880" y2="70"/>
    <line x1="360" y1="130" x2="880" y2="130"/>
    <line x1="360" y1="190" x2="880" y2="190"/>
    <line x1="360" y1="262" x2="880" y2="262"/>
    <line x1="360" y1="372" x2="880" y2="372" opacity="0.5"/>
  </g>
  <g fill="#4a7fb0" text-anchor="end">
    <text x="880" y="64">500 hPa</text><text x="880" y="124">600 hPa</text>
    <text x="880" y="184">700 hPa</text><text x="880" y="256">850 hPa</text><text x="872" y="388" opacity="0.7">1000 hPa (below ground)</text>
  </g>
  <line x1="505" y1="130" x2="650" y2="130" stroke="#1f5f99" stroke-width="3"/>
  <line x1="505" y1="190" x2="650" y2="190" stroke="#1f5f99" stroke-width="3"/>
  <text x="380" y="120" fill="#1f5f99">level k: z<tspan baseline-shift="sub" font-size="10">k</tspan>, T<tspan baseline-shift="sub" font-size="10">k</tspan>, q<tspan baseline-shift="sub" font-size="10">k</tspan>…</text>
  <text x="380" y="208" fill="#1f5f99">level k+1</text>
  <circle cx="560" cy="150" r="6" fill="#c0392b"/>
  <text x="572" y="155" fill="#c0392b" font-weight="bold">P (summit)</text>
  <circle cx="690" cy="320" r="6" fill="#c0392b"/>
  <text x="680" y="324" fill="#c0392b" font-weight="bold" text-anchor="end">Q (valley)</text>
  <text x="455" y="88" font-size="12">linear in height between the two levels around z:</text>
  <text x="455" y="105" font-size="12">T(z) = T<tspan baseline-shift="sub" font-size="10">k+1</tspan> + (T<tspan baseline-shift="sub" font-size="10">k</tspan> − T<tspan baseline-shift="sub" font-size="10">k+1</tspan>)(z − z<tspan baseline-shift="sub" font-size="10">k+1</tspan>)/(z<tspan baseline-shift="sub" font-size="10">k</tspan> − z<tspan baseline-shift="sub" font-size="10">k+1</tspan>)</text>
  <text x="640" y="212" fill="#555" font-size="12">Q, below the ERA5 surface,</text>
  <text x="640" y="227" fill="#555" font-size="12">lies between 850 and 1000 hPa</text>
  <text x="372" y="362" fill="#555">real terrain (DEM)</text>
</svg>
