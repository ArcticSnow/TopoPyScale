site_name: TopoPyScale
site_url: https://topopyscale.readthedocs.io/en/latest/
site_author: Simon Filhol, Joel Fiddes
copyright: GNU GPL3
nav:
    - Home: index.md
    - Use Cases: 00_use_cases.md
    - Installation: 01_install.md
    - Quick Start: 02_quickstart.md
    - Project Configuration: 03_configurationFile.md
    - Datasets: 04_datasetSources.md
    - Outputs: 05_outputs.md
    - Examples: 06_examples.md
    - Features: 07_features.md
    - Physics Checks: 09_physics_checks.md
    - Release Notes: 10_release_notes.md
    - Development: 08_development.md
    - FAQ: 20_FAQ.md
    - API:
        - topoclass: TopoPyScale.topoclass.md
        - topo_sub: TopoPyScale.topo_sub.md
        - topo_scale_zarr: TopoPyScale.topo_scale_zarr.md
        - toposcale_core: TopoPyScale.toposcale_core.md
        - surface_effect: TopoPyScale.surface_effect.md
        - surface_calib: TopoPyScale.surface_calib.md
        - solar_geom: TopoPyScale.solar_geom.md
        - topo_param: TopoPyScale.topo_param.md
        - fetch_era5: TopoPyScale.fetch_era5.md
        - fetch_dem: TopoPyScale.fetch_dem.md
        - meteo_util: TopoPyScale.meteo_util.md
        - sim_fsm: TopoPyScale.sim_fsm.md
        - sim_fsm2oshd: TopoPyScale.sim_fsm2oshd.md
        - topo_export: TopoPyScale.topo_export.md
        - topo_checks: TopoPyScale.topo_checks.md
        - topo_da: TopoPyScale.topo_da.md
        - topo_obs: TopoPyScale.topo_obs.md
        - topo_utils: TopoPyScale.topo_utils.md
        - topo_compare: TopoPyScale.topo_compare.md
        - topo_plot: TopoPyScale.topo_plot.md


theme:
  name: material
  palette:
    primary: teal
  logo: logo.png
markdown_extensions:
  - md_in_html
  - attr_list
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - footnotes
plugins:
  - search
  - bibtex:
      bib_file: docs/refs.bib
