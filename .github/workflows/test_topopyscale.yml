name: Tests

# the test suite on every push and pull request: a check mark (or a cross) next to each commit and pull request
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install TopoPyScale and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest flake8

      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Tests
        run: python -m pytest tests -q
